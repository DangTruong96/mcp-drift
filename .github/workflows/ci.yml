name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .
      - name: Unit + end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Smoke — CLI help
        run: mcp-drift --help
      - name: Smoke — snapshot/check against the fake server
        run: |
          mcp-drift snapshot --config examples/client-config.json --server fake -o /tmp/smoke.lock.json
          mcp-drift check --config examples/client-config.json --server fake --lock /tmp/smoke.lock.json
          mcp-drift snapshot --tools-file examples/tools-v1.json -o /tmp/tools.lock.json
          mcp-drift check --tools-file examples/tools-v1.json --lock /tmp/tools.lock.json
