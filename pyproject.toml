[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-drift"
version = "0.2.1"
description = "A lockfile for MCP tool definitions: snapshot what a server serves, then fail CI when it silently changes (rug pulls, poisoned edits, version lies)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DangTruong96" }]
keywords = ["mcp", "model-context-protocol", "security", "rug-pull",
            "tool-poisoning", "ci", "cli", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DangTruong96/mcp-drift"
Repository = "https://github.com/DangTruong96/mcp-drift"

[project.scripts]
mcp-drift = "mcp_drift:main"

[tool.setuptools]
py-modules = ["mcp_drift"]
